name: word-docx

on:
  pull_request:
    paths:
      - ".pi/extensions/word/**"
      - "pyproject.toml"
      - "uv.lock"
      - "bun.lock"
      - "Makefile"
      - "scripts/setup/**"
      - "scripts/system/tests/test_setup_exit_status.py"
      - ".github/workflows/word-docx.yml"
  push:
    branches: [main]
    paths:
      - ".pi/extensions/word/**"
      - "pyproject.toml"
      - "uv.lock"
      - "bun.lock"
      - "Makefile"
      - "scripts/setup/**"
      - "scripts/system/tests/test_setup_exit_status.py"
      - ".github/workflows/word-docx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    name: Word / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.8.22

      - name: Sync locked Python environment
        run: uv sync --extra dev --frozen

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Word TypeScript unit tests
        working-directory: .pi/extensions/word
        run: bun run test:unit

      - name: Word Python renderer tests
        run: >-
          uv run --frozen python -m pytest
          .pi/extensions/word/tests/python
          -p no:cacheprovider --tb=short -q

      - name: Word TypeScript-to-Python integration tests
        working-directory: .pi/extensions/word
        run: bun run test:integration

      - name: Prove exact sync keeps the Word runtime
        run: |
          uv sync --extra dev --frozen
          uv run --frozen python -c "import docx, markdown_it, PIL; print('word runtime OK')"

  standards:
    name: Word / standards and setup status
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.8.22

      - name: Sync locked Python environment
        run: uv sync --extra dev --frozen

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Python format, lint, and type checks
        run: |
          uv run --frozen black --check --config pyproject.toml \
            .pi/extensions/word/generate_docx.py \
            .pi/extensions/word/tests/python \
            scripts/system/tests/test_setup_exit_status.py
          uv run --frozen flake8 --config .flake8 \
            .pi/extensions/word/generate_docx.py \
            .pi/extensions/word/tests/python \
            scripts/system/tests/test_setup_exit_status.py
          uv run --frozen mypy --config-file pyproject.toml \
            .pi/extensions/word/generate_docx.py \
            .pi/extensions/word/tests/python \
            scripts/system/tests/test_setup_exit_status.py

      - name: TypeScript format, lint, and type checks
        run: |
          bunx prettier --check \
            .pi/extensions/word \
            .github/workflows/word-docx.yml
          bunx eslint --no-ignore \
            .pi/extensions/word/index.ts \
            .pi/extensions/word/tests/unit/extension.test.ts \
            .pi/extensions/word/tests/integration/generator.test.ts \
            .pi/extensions/word/tests/vitest.config.ts \
            .pi/extensions/word/tests/vitest.integration.config.ts
          cd .pi/extensions/word && bunx tsc --noEmit

      - name: Setup failure-status regression tests
        run: >-
          uv run --frozen python -m pytest
          scripts/system/tests/test_setup_exit_status.py
          -p no:cacheprovider --tb=short -q

      - name: Shell syntax and public-repository boundary
        run: |
          bash -n scripts/setup/setup.sh scripts/setup/init-external-tools.sh
          uv run --frozen python scripts/system/checks/check_public_boundary.py

  libreoffice-render:
    name: Word / LibreOffice compatibility smoke
    runs-on: ubuntu-latest
    needs: [structural, standards]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv and LibreOffice
        run: |
          python -m pip install uv==0.8.22
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Sync locked Python environment
        run: uv sync --extra dev --frozen

      - name: Generate and render a representative document
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/word-render"
          mkdir -p "$artifact_dir"
          python - "$artifact_dir/spec.json" "$artifact_dir/sample.docx" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "markdown": "# Word Regression Fixture\n\nAlpha\nBeta\n\n## Table\n\n| Status | Description |\n| --- | --- |\n| OK | Content-aware table sizing |\n\n```python\nfirst = 1\nsecond = 2\n```",
                      "title_mode": "inline",
                      "output_path": sys.argv[2],
                      "project_root": ".",
                  },
                  handle,
              )
          PY
          uv run --frozen python .pi/extensions/word/generate_docx.py \
            < "$artifact_dir/spec.json" > "$artifact_dir/result.json"
          libreoffice --headless --convert-to pdf --outdir "$artifact_dir" \
            "$artifact_dir/sample.docx"
          test -s "$artifact_dir/sample.docx"
          test -s "$artifact_dir/sample.pdf"
