name: word-docx

on:
  pull_request:
    paths:
      - ".pi/extensions/word/**"
      - "pyproject.toml"
      - "uv.lock"
      - "bun.lock"
      - "Makefile"
      - "scripts/setup/**"
      - "scripts/system/tests/test_setup_exit_status.py"
      - ".github/workflows/word-docx.yml"
  push:
    branches: [main]
    paths:
      - ".pi/extensions/word/**"
      - "pyproject.toml"
      - "uv.lock"
      - "bun.lock"
      - "Makefile"
      - "scripts/setup/**"
      - "scripts/system/tests/test_setup_exit_status.py"
      - ".github/workflows/word-docx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    name: Word / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Word TypeScript unit tests
        working-directory: .pi/extensions/word
        run: bun run test:unit

      - name: Word TypeScript integration tests
        working-directory: .pi/extensions/word
        run: bun run test:integration

  standards:
    name: Word / standards and setup status
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.8.22

      - name: Sync locked Python environment
        run: uv sync --extra dev --frozen

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript format, lint, and type checks
        run: |
          bunx prettier --check \
            .pi/extensions/word \
            .github/workflows/word-docx.yml
          bunx eslint --no-ignore \
            .pi/extensions/word/index.ts \
            .pi/extensions/word/renderer.ts \
            .pi/extensions/word/tests/helpers/docx.ts \
            .pi/extensions/word/tests/unit/extension.test.ts \
            .pi/extensions/word/tests/integration/generator.test.ts \
            .pi/extensions/word/tests/vitest.config.ts \
            .pi/extensions/word/tests/vitest.integration.config.ts
          cd .pi/extensions/word && bunx tsc --noEmit

      - name: Setup failure-status regression tests
        run: >-
          uv run --frozen python -m pytest
          scripts/system/tests/test_setup_exit_status.py
          -p no:cacheprovider --tb=short -q

      - name: Shell syntax and public-repository boundary
        run: |
          bash -n scripts/setup/setup.sh scripts/setup/init-external-tools.sh
          uv run --frozen python scripts/system/checks/check_public_boundary.py

  libreoffice-render:
    name: Word / LibreOffice compatibility smoke
    runs-on: ubuntu-latest
    needs: [structural, standards]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Generate and render a representative document
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/word-render"
          mkdir -p "$artifact_dir"
          bun -e '
          import { buildSpec, runGenerator, getProjectRoot } from "./.pi/extensions/word/index.ts";
          const output = process.argv[2];
          const spec = buildSpec(
            {
              markdown: "# Word Regression Fixture\n\nAlpha\nBeta\n\n## Table\n\n| Status | Description |\n| --- | --- |\n| OK | Content-aware table sizing |\n\n```python\nfirst = 1\nsecond = 2\n```",
              title_mode: "inline",
              output_path: output,
            },
            getProjectRoot()
          );
          const outcome = await runGenerator(spec, undefined);
          if (outcome.cancelled) throw new Error("Unexpected cancellation");
          await Bun.write(process.argv[3], JSON.stringify(outcome.result, null, 2));
          ' -- "$artifact_dir/sample.docx" "$artifact_dir/result.json"
          libreoffice --headless --convert-to pdf --outdir "$artifact_dir" \
            "$artifact_dir/sample.docx"
          test -s "$artifact_dir/sample.docx"
          test -s "$artifact_dir/sample.pdf"
