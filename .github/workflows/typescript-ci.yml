name: typescript-ci

# Remote workflow exercise, final-SHA status queries, and branch-check settings are
# intentionally unverified here; TS-430 did not authorize remote operations.
on:
  pull_request:
  push:

permissions:
  contents: read

env:
  # Keep live-model, external browser/network, and operator-provisioned credential
  # paths disabled even if a self-hosted runner has matching variables or a local .env file.
  PENNY_KB_MODEL_SMOKE: "0"
  PENNY_MEMORY_MCP_TOKEN_ENV: ""
  PENNY_MEMORY_MCP_TOKEN_FILE: ""
  PENNY_PLAYWRIGHT_BROWSER_TESTS: "0"
  PENNY_YOUTUBE_NETWORK_TESTS: "0"

jobs:
  repository-typescript:
    name: Repository TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      # The local provisioner pins Gitleaks v8.30.1 and verifies the checksums file,
      # release archive, extracted binary digest, and reported binary version.
      - name: Provision pinned Gitleaks
        run: bun run security:secrets:provision

      - name: Scan the event Git range with verified Gitleaks
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              scan_base=$PR_BASE_SHA
              scan_head=$GITHUB_SHA
              ;;
            push)
              scan_base=$BEFORE_SHA
              scan_head=$GITHUB_SHA
              if [ "$scan_base" = "$zero_sha" ] || \
                ! git cat-file -e "$scan_base^{commit}" 2>/dev/null; then
                default_ref="refs/remotes/origin/$DEFAULT_BRANCH"
                git cat-file -e "$default_ref^{commit}" 2>/dev/null || {
                  echo "Cannot resolve default-branch history for the Gitleaks range." >&2
                  exit 2
                }
                scan_base=$(git merge-base "$scan_head" "$default_ref") || {
                  echo "Pushed history has no merge base with the default branch." >&2
                  exit 2
                }
              fi
              ;;
            *)
              echo "Unsupported event for the Gitleaks range: $GITHUB_EVENT_NAME" >&2
              exit 2
              ;;
          esac

          bun run security:secrets:range -- "$scan_base..$scan_head"

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Validate workflow YAML and regression policy
        run: |
          bunx prettier --check ".github/workflows/*.{yml,yaml,mjs}"
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |path| YAML.parse_file(path); puts "Parsed #{path}" }'
          node .github/workflows/validate-workflows.mjs

      - name: Root format check
        run: bun run format:check

      - name: Root lint
        run: bun run lint

      - name: Root typecheck
        run: bun run typecheck

      - name: TypeScript inventory
        run: bun run typescript:inventory

      - name: TypeScript architecture guards
        run: bun run typescript:architecture

      - name: TypeScript negative guard tests
        run: bun run typescript:guard-tests

      - name: Repository TypeScript tests
        run: bun run test:typescript

      - name: Build observability
        run: bun run build:observability

      - name: Build orchestration
        run: bun run build:orchestration
