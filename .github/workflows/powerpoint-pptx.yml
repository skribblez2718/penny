name: powerpoint-pptx

on:
  pull_request:
    paths:
      - ".pi/extensions/powerpoint/**"
      - "pyproject.toml"
      - "uv.lock"
      - "bun.lock"
      - "Makefile"
      - ".github/workflows/powerpoint-pptx.yml"
  push:
    branches: [main]
    paths:
      - ".pi/extensions/powerpoint/**"
      - "pyproject.toml"
      - "uv.lock"
      - "bun.lock"
      - "Makefile"
      - ".github/workflows/powerpoint-pptx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    name: PowerPoint / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.8.22

      - name: Sync locked Python environment
        run: uv sync --extra dev --frozen

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: PowerPoint TypeScript unit tests
        working-directory: .pi/extensions/powerpoint
        run: bun run test:unit

      - name: PowerPoint Python structural tests
        run: >-
          uv run --frozen python -m pytest
          .pi/extensions/powerpoint/tests/python
          -p no:cacheprovider --tb=short -q

      - name: PowerPoint TypeScript-to-Python integration tests
        working-directory: .pi/extensions/powerpoint
        run: bun run test:integration

      - name: Prove exact sync keeps the PowerPoint runtime
        run: |
          uv sync --extra dev --frozen
          uv run --frozen python -c "import lxml, markdown_it, PIL, pptx; print('powerpoint runtime OK')"

  standards:
    name: PowerPoint / standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.8.22

      - name: Sync locked Python environment
        run: uv sync --extra dev --frozen

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Python format, lint, and type checks
        run: |
          uv run --frozen black --check --config pyproject.toml \
            .pi/extensions/powerpoint/generate_pptx.py \
            .pi/extensions/powerpoint/tests/python
          uv run --frozen flake8 --config .flake8 \
            .pi/extensions/powerpoint/generate_pptx.py \
            .pi/extensions/powerpoint/tests/python
          uv run --frozen mypy --config-file pyproject.toml \
            .pi/extensions/powerpoint/generate_pptx.py \
            .pi/extensions/powerpoint/tests/python

      - name: TypeScript format, lint, and type checks
        run: |
          bunx prettier --check \
            .pi/extensions/powerpoint \
            .github/workflows/powerpoint-pptx.yml
          bunx eslint --no-ignore \
            .pi/extensions/powerpoint/index.ts \
            .pi/extensions/powerpoint/tests/unit/extension.test.ts \
            .pi/extensions/powerpoint/tests/integration/generator.test.ts \
            .pi/extensions/powerpoint/tests/vitest.config.ts \
            .pi/extensions/powerpoint/tests/vitest.integration.config.ts
          cd .pi/extensions/powerpoint && bunx tsc --noEmit

      - name: Public repository boundary
        run: uv run --frozen python scripts/system/checks/check_public_boundary.py
