name: powerpoint-pptx

on:
  pull_request:
    paths:
      - ".pi/extensions/powerpoint/**"
      - "pyproject.toml"
      - "uv.lock"
      - "bun.lock"
      - "Makefile"
      - ".github/workflows/powerpoint-pptx.yml"
  push:
    branches: [main]
    paths:
      - ".pi/extensions/powerpoint/**"
      - "pyproject.toml"
      - "uv.lock"
      - "bun.lock"
      - "Makefile"
      - ".github/workflows/powerpoint-pptx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    name: PowerPoint / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: PowerPoint TypeScript unit tests
        working-directory: .pi/extensions/powerpoint
        run: bun run test:unit

      - name: PowerPoint TypeScript integration tests
        working-directory: .pi/extensions/powerpoint
        run: bun run test:integration

  standards:
    name: PowerPoint / standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.8.22

      - name: Sync locked Python environment
        run: uv sync --extra dev --frozen

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript format, lint, and type checks
        run: |
          bunx prettier --check \
            .pi/extensions/powerpoint \
            .github/workflows/powerpoint-pptx.yml
          bunx eslint --no-ignore \
            .pi/extensions/powerpoint/index.ts \
            .pi/extensions/powerpoint/renderer.ts \
            .pi/extensions/powerpoint/tests/helpers/pptx.ts \
            .pi/extensions/powerpoint/tests/unit/extension.test.ts \
            .pi/extensions/powerpoint/tests/integration/generator.test.ts \
            .pi/extensions/powerpoint/tests/vitest.config.ts \
            .pi/extensions/powerpoint/tests/vitest.integration.config.ts
          cd .pi/extensions/powerpoint && bunx tsc --noEmit

      - name: Public repository boundary
        run: uv run --frozen python scripts/system/checks/check_public_boundary.py
