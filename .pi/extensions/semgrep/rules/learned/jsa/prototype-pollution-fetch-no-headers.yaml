rules:
- id: jsa-learned-fetch-post-no-headers-pp-gadget
  message: >
    fetch() POST call without explicit 'headers' property in options object.
    If Object.prototype is polluted (e.g., via deparam.js __proto__[headers]),
    the fetch options object inherits polluted headers from the prototype chain.
    This enables arbitrary HTTP header injection into fetch requests.
  metadata:
    cwe:
    - "CWE-1321: Improperly Controlled Modification of Object Prototype Attributes"
    category: security
    technology:
    - browser
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
  languages:
  - javascript
  - typescript
  severity: WARNING
  patterns:
  - pattern: 'fetch($URL, { ..., method: "post", ... })'
  - pattern-not: 'fetch($URL, { ..., headers: $H, ... })'
