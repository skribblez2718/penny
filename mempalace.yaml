# mempalace.yaml — curated MemPalace taxonomy for this repository
#
# MemPalace is pinned to 3.7.1. Normal runtime and administration use one
# authenticated, supervised HTTP hub. They do not open palace bytes and do not
# fall back to a raw/direct peer.
#
# The upstream CLI may read this file when mining caller-selected source files.
# The Penny memory extension does not use it as a tool grant, service registry,
# retention plan, deletion authority, or workflow-handoff manifest. Editing this
# taxonomy never deletes data. Setup and uninstall preserve caller-owned data;
# migration, retention apply, repair, or deletion require separate explicit gates.
#
# Historical `skills/<skill>-<session_id>` rooms are legacy corpus. They are not
# active handoff channels and are intentionally absent from this curated room
# list. See the retention documentation before classifying legacy data.

wing: penny

rooms:
  - name: architecture
    description: Curated system architecture and structural decisions
  - name: decisions
    description: Consequential decisions and their rationale
  - name: planning
    description: Durable plans and roadmaps selected for later reuse
  - name: research
    description: Curated research findings and reports
  - name: technical
    description: Reusable technical notes and implementation references
  - name: skills
    description: Curated cross-run skill knowledge, never active workflow handoff
  - name: sessions
    description: Selected primary-session summaries worth durable recall
  - name: diary
    description: Primary Penny diary entries
  - name: projects
    description: Reusable project context supplied without downstream-specific paths
  - name: user
    description: User preferences and durable personal context
  - name: general
    description: Fallback taxonomy room for explicitly curated content

file_patterns:
  - "**/*.ts"
  - "**/*.js"
  - "**/*.md"
exclude:
  - "node_modules/**"
  - ".venv/**"
  - "**/*.test.ts"
