[project]
name = "penny"
version = "0.1.0"
description = "Penny - Personal AI assistant with MemPalace memory system"
requires-python = ">=3.12"
dependencies = [
    "mempalace==3.7.1",
    # Pinned to the 1.5.x line: the on-disk ChromaDB index/segment format can
    # change across minor versions, and an existing palace written by one line
    # can segfault another line's native (rust) core on read/write. A minor bump
    # must be a deliberate, migration-aware step — not a silent `pip -U`.
    # Recover a corrupted palace with scripts/system/bridge/repair_palace.py.
    "chromadb>=1.5.9,<1.6",
    "python-statemachine>=2.0",   # retained by the independent memory-canary authority FSM
    "tiktoken>=0.11.0",           # canonical SYSTEM.md token-budget counter
    "pydantic>=2.12,<3",          # scripts/validate_ideal_state.py
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",      # per-test timeout safety net for `make test`
    "flake8>=7.0.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "isort>=5.13.0",
    "types-PyYAML>=6.0.12",
]

# Use 'uv' for all Python dependency management:
#   make setup     — full setup (venv + deps + init)
#   uv sync        — sync dependencies from pyproject.toml
#   uv add <pkg>   — add a new dependency

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.megg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | node_modules
    | audits
    | ideas
    | plans
    | research
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
explicit_package_bases = true
ignore_missing_imports = true
exclude = [
    "\\.venv/",
    "node_modules/",
    "audits/",      # Historical audit snapshots are not project source.
    "ideas/",       # Gitignored exploratory work is not project source.
    ".*/tests/",    # Pytest remains its own gate while legacy test helpers are typed incrementally.
    "\\.mempalace/",
]

[tool.pytest.ini_options]
testpaths = [".pi/extensions/*/tests", "scripts/system/*/tests", "scripts/system/tests"]
python_files = ["*.test.py", "test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "e2e: end-to-end tests (may hit external/live services)",
    "slow: slow tests",
    "network: tests requiring network access",
    "integration: integration tests (may require a running service)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
pythonpath = ["scripts/system"]